frr version 8.4.1
frr defaults traditional
hostname R2
log syslog informational
no ipv6 forwarding
!
interface eth1
 description Link to R1
 ip address 10.0.1.2/24
!
interface eth2
 description Link to R3
 ip address 10.0.2.1/24
!
interface lo
 ip address 10.30.0.1/24
!
! Bootstrap routing tables
ip route 10.10.0.0/24 10.0.1.1
ip route 10.20.0.0/24 10.0.2.2
!
line vty
!
