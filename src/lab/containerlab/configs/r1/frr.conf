frr version 8.4.1
frr defaults traditional
hostname R1
log syslog informational
no ipv6 forwarding
!
interface eth1
 description Link to R2
 ip address 10.0.1.1/24
!
interface eth2
 description Operations LAN
 ip address 10.10.0.1/24
!
! Initial state: R1 has NO route to Engineering LAN (10.20.0.0/24).
! The PS-008 agent will generate and apply:
!   ip route 10.20.0.0/24 10.0.1.2
!
line vty
!
