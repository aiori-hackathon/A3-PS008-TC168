frr version 8.4.1
frr defaults traditional
hostname R3
log syslog informational
no ipv6 forwarding
!
interface eth1
 description Link to R2
 ip address 10.0.2.2/24
!
interface eth2
 description Engineering LAN
 ip address 10.20.0.1/24
!
! Bootstrap routing tables
ip route 10.10.0.0/24 10.0.2.1
ip route 10.30.0.0/24 10.0.2.1
!
line vty
!
